services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: actuary
      POSTGRES_PASSWORD: actuary
      POSTGRES_DB: claims
    ports:
      - "55432:5432"
    volumes:
      # 首次启动按文件名顺序执行：schema -> 种子数据 -> SQL 补录示例
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U actuary -d claims"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://actuary:actuary@db:5432/claims
      MAX_SESSIONS: "2"
      SESSION_TTL_SECONDS: "60"
      PAGE_SIZE_CAP: "100"
      # 快照会话专用池：上限与会话名额相同（2）。两条会话占满会话池后，
      # 源端写入仍走独立的写入池立即提交（本服务的连接分配设计）。
      POOL_MAX_SIZE: "2"
      WRITE_POOL_MAX_SIZE: "2"
      CONN_TIMEOUT_SECONDS: "10"
      # 开启后可用 X-Debug-Sleep-Seconds 头制造慢取页，供演示使用
      ENABLE_DEBUG_HOOKS: "true"
    ports:
      - "8000:8000"

volumes:
  pgdata:
